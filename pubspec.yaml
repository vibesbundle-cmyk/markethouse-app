name: markethouse
description: MarketHouse social commerce app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # Local storage (token + cached user profile)
  shared_preferences: ^2.2.3

  # WebSocket
  web_socket_channel: ^2.4.5

  # Image picker
  image_picker: ^1.1.2

  # Image cropper (optional crop, all aspect ratios available)
  image_cropper: ^7.1.0

  # Video player
  video_player: ^2.9.1

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.2

  # Fonts
  google_fonts: ^6.2.1

  # OTP input
  pinput: ^5.0.0

  #JOJ
  photo_manager: ^3.0.0

  # Secure storage (token)
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

  # Contact syncing (People You May Know)
  flutter_contacts: ^2.3.1

  # Date formatting (orders/checkout)
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true